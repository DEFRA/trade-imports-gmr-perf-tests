name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: write
  packages: read

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'
  HUSKY: 0

jobs:
  build:
    if: github.run_number != 1
    name: Build, version and publish
    runs-on: ubuntu-latest
    env:
      DEFRA_NUGET_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Build the test suite
        uses: DEFRA/cdp-build-action/build-test@99f1b3c7c622347a66476a8c659189f832701bd8 # v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-secrets: |
            DEFRA_NUGET_PAT: ${{ env.DEFRA_NUGET_PAT }}
