name: Check pull request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: write

env:
  HUSKY: 0

jobs:
  pr-validator:
    name: Run pull request checks
    runs-on: ubuntu-latest
    env:
      DEFRA_NUGET_PAT: ${{ secrets.GITHUB_TOKEN }}
      GVMS_API_CLIENT_ID: ${{ secrets.GVMS_API_CLIENT_ID }}
      GVMS_API_CLIENT_SECRET: ${{ secrets.GVMS_API_CLIENT_SECRET }}

    steps:
      - name: Checkout current repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Check linting
        run: npm run lint

      - name: Log in to Docker Hub
        uses: DEFRA/cdp-build-action/docker-login@main

      - name: Checkout trade-imports-gmr-local-env
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: DEFRA/trade-imports-gmr-local-env
          ref: 0.1.0
          path: trade-imports-gmr-local-env

      - name: Start trade-imports-gmr-local-env
        working-directory: trade-imports-gmr-local-env
        run: docker compose up --wait --wait-timeout 300 --quiet-pull

      - name: Generate test fixtures
        run: npm run generate-fixtures

      - name: Set up k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1

      - name: Run smoke test
        run: npm run test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: ./reports

      - name: Capture Docker Compose logs
        if: always()
        working-directory: trade-imports-gmr-local-env
        run: docker compose logs > logs.txt

      - name: Upload Docker Compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: trade-imports-gmr-local-env/logs.txt
